[package]
name        = "max17048-nv"
version     = "0.1.0"
description = "A driver for Analog Devices' MAX17048 and MAX17049 battery fuel gauges on an I2C bus: the cell voltage in millivolts, the state of charge in 1/256 percent, the charge rate, the alerts, quick start, hibernate and sleep, the reset, and the RCOMP update against temperature, as devices-nv's PowerManager battery side and Identifiable."
license     = "Apache-2.0"
stability   = "experimental"
category    = "embedded"
layer       = "host"
tags        = ["max17048", "max17049", "fuel-gauge", "battery", "pmic", "i2c", "modelgauge", "nrf52840-dk", "nrf54lm20-dk"]
repository  = "https://github.com/novolang/max17048-nv"
maintainers = ["novo-lang"]
# The toolchain floor of the published drivers this one is modelled on.
novo        = ">= 0.21.1"

# Every module of the package checks at the embedded tier, so a program
# of any tier, embedded, rt or system, may call it.
[tier]
tier = "embedded"

# The device program, examples/battery_monitor.nv, has no [[bin]] entry:
# an entry makes the registry list the package as a program, and a
# library with an entry would be built by `novo install` for the host.
# tests/device_build.sh builds the program for two boards as the main of
# a scratch package that depends on this one.

[dependencies]
# The board's I2C bus and GPIO handles, and the I2cBus and GpioOut
# traits they implement.
embedded-hal-nv = "^0.3.2"
# The wiring record a board's device table hands `attach`, the register
# helpers, and the PowerManager and Identifiable traits.
devices-nv      = "^0.3.2"
